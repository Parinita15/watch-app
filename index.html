<!DOCTYPE html>
<html>
<head>
    <link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Richard's Luxury Watch Collection</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
</head>
<body>

<h1>Welcome, Richard! Your Personal Watch Collection</h1>

<!-- Watch Card -->
<div class="card">
    <img id="watchImage">
    <h2 id="brand"></h2>
    <p id="model"></p>
    <a id="buyLink" target="_blank">View Details</a>
    <p id="note" class="note"></p>
</div>

<!-- Buttons -->
<div class="buttons">
    <button onclick="skipWatch()">Skip</button>
    <button onclick="likeWatch()">Like</button>
    <button onclick="saveCurrentWatch()">Save ❤️</button>
</div>

<!-- Saved Watches Section -->
<div id="savedSection">
    <h2>Saved Watches</h2>
    <div id="savedWatches"></div>
</div>

<<!-- Recommendations via Google Form -->
<div id="recommendationBox">
    <h2>Recommendations</h2>
    <iframe 
        src="https://docs.google.com/forms/d/e/1FAIpQLSdLn41xbNtAGkgM8aTFyMH6qoAL0qvAHv6gw8X9TyEy2etH0Q/viewform?usp=publish-editor" 
        width="100%" 
        height="250" 
        frameborder="0" 
        marginheight="0" 
        marginwidth="0">
        Loading…
    </iframe>
</div>


<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

<!-- Your script -->
<script src="script.js"></script>

</body>
</html>
