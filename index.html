<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richard's Luxury Watch Collection</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
</head>
<body>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <button onclick="showView('homeView')">🏠</button>
    <button onclick="showView('notesView')">📝</button>
    <button onclick="showView('linksView')">🔗</button>
</div>

<!-- Home Page -->
<div id="homeView" class="view active">
    <h1>Welcome, Richard! Your Personal Watch Collection</h1>

    <!-- Watch Card -->
    <div class="card">
        <img id="watchImage" src="">
        <h2 id="brand"></h2>
        <p id="model"></p>
        <p id="note" class="note"></p>
        <a id="buyLink" target="_blank">View Details</a>
        <input type="text" id="watchNoteInput" placeholder="Write a note for this watch">
<button onclick="saveWatchNote()">Save Note</button>

    </div>

    <!-- Buttons -->
    <div class="buttons">
        <button onclick="skipWatch()">Skip</button>
        <button onclick="saveCurrentWatch()">Like ❤️</button>
    </div>

    <!-- Saved Watches Section -->
    <div id="savedSection">
        <h2>Liked Watches</h2>
        <div id="savedWatches"></div>
    </div>

    <!-- Recommendations -->
    <div id="recommendationBox">
        <h2>Recommendations</h2>
        <iframe 
            src="https://docs.google.com/forms/d/e/1FAIpQLSdLn41xbNtAGkgM8aTFyMH6qoAL0qvAHv6gw8X9TyEy2etH0Q/viewform?usp=publish-editor" 
            width="100%" 
            height="250" 
            frameborder="0"></iframe>
    </div>
</div>

<!-- Notes Page -->
<div id="notesView" class="view">
    <h2>Collector Notes</h2>
    <textarea id="noteInput" placeholder="Write a note..."></textarea>
    <button type="button" onclick="saveNote()">Save Note</button>
    <div id="notesContainer"></div>
</div>

<!-- Make sure Hammer.js is included BEFORE your script.js -->
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="script.js"></script>


<!-- Links Page -->
<div id="linksView" class="view">
    <h2>Quick Links</h2>

    <input id="linkTitle" placeholder="Link name">
    <input id="linkURL" placeholder="https://">
    <button type="button" onclick="saveLink()">Save Link</button>

    <ul id="linksList"></ul>
</div>

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

<!-- Script -->
<script src="script.js"></script>
</body>
</html>
